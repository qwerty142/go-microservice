version: "3.8"

networks:
  internal:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:
  cart:
    container_name: cart
    image: cart
    build:
      context: ./cart
      dockerfile: ./Dockerfile
    ports:
      - "8082:8082" # HTTP
    networks:
      - internal
    depends_on:
      - loms

  loms:
    container_name: loms
    image: loms
    build:
      context: ./loms
      dockerfile: ./Dockerfile
    environment:
      DB_CONN: ${DB_CONN}
    ports:
      - "8081:8081" # HTTP
      - "50051:50051" # gRPC
    networks:
      - internal
    depends_on:
      - kafka0
      - loms-db
  
  notifier-1:
    container_name: notifier-1
    image: notifier
    build:
      context: ./notifier
      dockerfile: ./Dockerfile
    networks:
      - internal
    depends_on:
      - kafka0

  notifier-2:
    container_name: notifier-2
    image: notifier
    networks:
      - internal
    depends_on:
      - kafka0
      - notifier-1

  notifier-3:
    container_name: notifier-3
    image: notifier
    networks:
      - internal
    depends_on:
      - kafka0
      - notifier-1

  loms-db:
    container_name: loms-db
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - internal
  
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - internal

  grafana:
    image: grafana/grafana-oss:10.4.1
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3000:3000"
    networks:
      - internal
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "4318:4318"   # collector | accept OpenTelemetry Protocol (OTLP) over HTTP
      - "16686:16686" # query     | serve frontend
    networks:
      - internal
  
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      - kafka0
      - kafka-init-topics
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka0:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - internal

  kafka0:
    container_name: kafka0
    image: confluentinc/cp-kafka:7.6.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka0:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka0:29092,CONTROLLER://kafka0:29093,PLAINTEXT_HOST://:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:29093"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
  #    command: "bash -c '/tmp/run_workaround.sh && /etc/confluent/docker/run'"
    networks:
      - internal

  kafka-init-topics:
    container_name: kafka-init-topics
    image: confluentinc/cp-kafka:7.6.2
    networks:
      - internal
    depends_on:
      - kafka0
    command: "bash -c 'echo Waiting for Kafka to be ready... && \
              cub kafka-ready -b kafka0:29092 1 30 && \
              kafka-topics --create --topic loms.order-events --partitions 2 --replication-factor 1 --if-not-exists --bootstrap-server kafka0:29092'"


