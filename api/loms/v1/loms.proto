syntax = "proto3";

package route256.loms.pkg.notes.v1;

option go_package = "route256/loms/pkg/api/loms/v1;loms";

import "google/protobuf/empty.proto";
import "validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Logistics and Order Management System";
        version: "1.0.0";
    };
    schemes: HTTP;
    schemes: HTTPS;
    consumes: "application/json";
    produces: "application/json";
};


service Loms {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
        description: "Сервис отвечает за учет заказов и стоки по товарам."
    };

    rpc OrderCreate(OrderCreateRequest) returns (OrderCreateResponse) {
        option (google.api.http) = {
            post: "/v1/order/create"
            body: "*"
        };
    }

    rpc OrderInfo(OrderInfoRequest) returns (OrderInfoResponse) {
        option (google.api.http) = {
            get: "/v1/order/{order_id}/info"
        };
    }

    rpc OrderPay(OrderPayRequest) returns (OrderPayResponse) {
        option (google.api.http) = {
            post: "/v1/order/{order_id}/pay"
            body: "*"
        };
    }

    rpc OrderCancel(OrderCancelRequest) returns (OrderCancelResponse) {
        option (google.api.http) = {
            delete: "/v1/order/{order_id}/cancel"
        };
    }

    rpc StocksInfo(StocksInfoRequest) returns (StocksInfoResponse) {
        option (google.api.http) = {
            get: "/v1/stocks/{sku_id}/info"
        };
    }
}

message Item {
    int64 sku_id = 1 [
        (validate.rules).int64.gt = 0
    ];
    uint32 count = 2;
}

// OrderCreate
message OrderCreateRequest {
    int64 user_id = 1;
    repeated Item items = 2;
}

message OrderCreateResponse {
    int64 order_id = 1;
}

// OrderInfo
message OrderInfoRequest {
    int64 order_id = 1;
}

message OrderInfoResponse {
    string status = 1 [
        (validate.rules).string = {
            pattern: "^(new|awaiting payment|failed|payed|cancelled)$"
        }
    ];
    int64 user_id = 2;
    repeated Item items = 3;
}

// OrderPay
message OrderPayRequest {
    int64 order_id = 1;
}

message OrderPayResponse {
}

// OrderCancel
message OrderCancelRequest {
    int64 order_id = 1;
}

message OrderCancelResponse {
}

// StocksInfo
message StocksInfoRequest {
    int64 sku_id = 1 [
        (validate.rules).int64.gt = 0
    ];
}

message StocksInfoResponse {
    uint64 count = 1;
}
